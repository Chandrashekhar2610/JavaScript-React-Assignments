
name: Deploy All Six Assignments

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare website folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Copy JavaScript assignments
        run: |
          cp -R Assignment-1-JS-Calculator _site/
          cp -R Assignment-2-Todo-List _site/
          cp -R Assignment-3-Form-Validation _site/

      - name: Build React assignments
        run: |
          for folder in \
            Assignment-4-React-Profile-Card \
            Assignment-5-React-Controlled-Form \
            Assignment-6-React-Counter
          do
            echo "Building $folder"

            cd "$GITHUB_WORKSPACE/$folder"

            npm ci
            npm run build -- --base=./

            mkdir -p "$GITHUB_WORKSPACE/_site/$folder"
            cp -R dist/. "$GITHUB_WORKSPACE/_site/$folder/"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
