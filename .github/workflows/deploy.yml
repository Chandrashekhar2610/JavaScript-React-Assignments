
name: Deploy Assignments to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -e
          mkdir -p site

          cp index.html site/index.html

          for d in \
            Assignment-1-JS-Calculator \
            Assignment-2-Todo-List \
            Assignment-3-Form-Validation
          do
            mkdir -p "site/$d"
            rsync -a \
              --exclude node_modules \
              --exclude .git \
              "$d/" "site/$d/"
          done

      - name: Build React Profile Card
        working-directory: Assignment-4-React-Profile-Card
        run: |
          npm install
          npm run build

      - name: Copy Profile Card build
        run: |
          mkdir -p site/Assignment-4-React-Profile-Card
          cp -R Assignment-4-React-Profile-Card/dist/. \
            site/Assignment-4-React-Profile-Card/

      - name: Build React Controlled Form
        working-directory: Assignment-5-React-Controlled-Form
        run: |
          npm install
          npm run build

      - name: Copy Controlled Form build
        run: |
          mkdir -p site/Assignment-5-React-Controlled-Form
          cp -R Assignment-5-React-Controlled-Form/dist/. \
            site/Assignment-5-React-Controlled-Form/

      - name: Build React Counter
        working-directory: Assignment-6-React-Counter
        run: |
          npm install
          npm run build

      - name: Copy Counter build
        run: |
          mkdir -p site/Assignment-6-React-Counter
          cp -R Assignment-6-React-Counter/dist/. \
            site/Assignment-6-React-Counter/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
